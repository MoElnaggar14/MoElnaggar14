<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="50%" stop-color="#FA7343"/>
      <stop offset="100%" stop-color="#F05138"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB347" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F05138" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="ds" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#7A2E12" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Solid gradient base -->
  <rect width="1200" height="240" fill="url(#g)"/>

  <!-- Soft wave overlay -->
  <path d="M0,180 C200,140 400,220 600,180 C800,140 1000,220 1200,180 L1200,240 L0,240 Z"
        fill="url(#g2)"/>
  <path d="M0,205 C220,170 440,235 660,200 C880,165 1080,230 1200,205 L1200,240 L0,240 Z"
        fill="#ffffff" fill-opacity="0.10"/>

  <!-- Title -->
  <text x="56" y="115" filter="url(#ds)"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="56" font-weight="800" fill="#ffffff" text-anchor="start"
        style="letter-spacing:-0.5px;">Mohammed Elnaggar</text>

  <!-- Subtitle -->
  <text x="56" y="160" filter="url(#ds)"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="20" font-weight="500" fill="#ffffff" fill-opacity="0.95" text-anchor="start">
    Global iOS Engineer  ·  Shipping across MENA, Europe &amp; LATAM  ·  Recognized by Apple
  </text>
</svg>
